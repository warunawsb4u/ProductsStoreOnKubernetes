name: 2-actions-ci-cd-aks-tf

on:
  push:
    branches: [ main ]
    paths: .github/workflows/2-actions-ci-cd-aks-tf.yml
  pull_request:
    branches: none
  workflow_dispatch:

jobs:

  build-deploy-aks:
    runs-on: ubuntu-latest
    env:
      DOCKER_REPOSITORY: wsb4u
      IMAGE_NAME: productstore
      IMAGE_TAG: ${{ github.run_number }}
      AKS_RESOURCE_GROUP: rg-aks-cluster
      AKS_NAME: aks-cluster-new
      ACR_NAME: acrforakstf023
      TERRAFORM_VERSION: 1.1.9
      WORKING_DIRECTORY: infra
      # ARM credentials available to ALL steps automatically
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:

    - uses: actions/checkout@v2

    # ─── Docker Build & Push ────────────────────────────────────────────────

    - name: Build Docker Image
      working-directory: .
      run:
        docker build ./MvcApp/ --file ./MvcApp/Dockerfile
          --tag $DOCKER_REPOSITORY/$IMAGE_NAME:$GITHUB_RUN_NUMBER
          --build-arg=token=ZGEzNTQ5Y2QyNjAx
          --no-cache

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: 'docker.io/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'MEDIUM,HIGH,CRITICAL'

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Image to Docker Hub
      run: docker push $DOCKER_REPOSITORY/$IMAGE_NAME:$GITHUB_RUN_NUMBER

    # ─── Terraform Setup ────────────────────────────────────────────────────

    - name: Replace tokens in terraform.tfvars
      uses: cschleiden/replace-tokens@v1.0
      with:
        tokenPrefix: __
        tokenSuffix: __
        files: infra/terraform.tfvars
      env:
        AKS_RESOURCE_GROUP: ${{ env.AKS_RESOURCE_GROUP }}
        AKS_NAME: ${{ env.AKS_NAME }}
        ACR_NAME: ${{ env.ACR_NAME }}
        SQL_INSTANCE_NAME: sqlforaks-tf-011
        DB_ADMIN_LOGIN: houssem
        DB_ADMIN_PASSWORD: "@Aa123456"
        STORAGE_NAME: storageforsql011
        LOCATION: "eastus2"

    - name: Validate no unreplaced tokens
      working-directory: infra
      run: |
        echo "=== terraform.tfvars after replacement ==="
        cat terraform.tfvars
        if grep -q "__.*__" terraform.tfvars; then
          echo "❌ Unreplaced tokens found!"
          exit 1
        fi
        echo "✅ All tokens replaced"

    - name: Replace azurerm with local in backend.tf
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "azurerm"
        replace: "local"
        include: "infra/backend.tf"
        regex: true

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check
      continue-on-error: true

    # ─── Azure Login & Terraform Plan/Apply ─────────────────────────────────

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Plan
      run: terraform plan

    - name: Terraform Apply
      run: terraform apply -auto-approve

    # ─── Kubernetes Deploy ──────────────────────────────────────────────────

    - name: Replace Image Name in Deployment
      uses: cschleiden/replace-tokens@v1
      with:
        files: '["kubernetes/*.yaml"]'
        tokenPrefix: __
        tokenSuffix: __
      env:
        DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}

    - name: Set AKS Context
      uses: Azure/aks-set-context@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        cluster-name: ${{ env.AKS_NAME }}            # ✅ fixed: was CLUSTER_NAME
        resource-group: ${{ env.AKS_RESOURCE_GROUP }} # ✅ fixed: was RESOURSE_GROUP (typo)

    - name: Deploy to AKS
      uses: Azure/k8s-deploy@v1
      with:
        manifests: |
          kubernetes/mssql-pv.azure.yaml
          kubernetes/mssql-configmap.yaml
          kubernetes/mssql-secret.yaml
          kubernetes/mssql-deployment.yaml
          kubernetes/mvc-deployment.azure.yaml

    # ─── Security Checks ────────────────────────────────────────────────────

    - name: Run Kube-Bench to check cluster config
      continue-on-error: true
      run: |
        kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/main/job-aks.yaml
        sleep 30s
        kubectl logs job.batch/kube-bench
        kubectl delete job.batch/kube-bench
